<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AYMARD 4D : Le Secret du Royaume Kongo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#000}
#menu{position:fixed;inset:0;background:linear-gradient(180deg,#1a3a1a,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:10;padding:20px}
#menu h1{font-size:36px;color:#FFD700}
#menu h1 span{font-size:14px;color:#00E5FF;display:block}
.btn{background:#FFD700;color:#000;border:none;padding:16px 34px;font-size:22px;font-weight:900;border-radius:50px;margin-top:16px}
#hud{position:fixed;top:10px;left:10px;right:10px;display:none;justify-content:space-between;color:#fff;font-weight:900;text-shadow:2px 2px 0 #000;z-index:5}
#controls{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 14px;z-index:5}
.cbtn{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.95);border:3px solid #000;font-size:22px;display:flex;align-items:center;justify-content:center}
#timeBtn{background:#00E5FF !important}
#dialog{position:fixed;bottom:100px;left:12px;right:12px;background:rgba(0,0,0,.85);color:#fff;padding:14px;border-radius:14px;display:none;z-index:6;border:2px solid #FFD700}
</style>
</head>
<body>
<div id="menu">
<div style="font-size:60px">🌍👦🏾⏳</div>
<h1>AYMARD 4D<span>LE SECRET DU ROYAUME KONGO - MONDE 1</span></h1>
<p style="margin:14px 0;line-height:1.6"><b>3D + TEMPS = 4D</b><br>🌞 JOUR : Forêt normale<br>🌙 NUIT / TEMPS : Plateformes cachées apparaissent<br><br>Boss : MOKÉ<br>Avec MAMA SONIA, TIKO, KAZI<br><br>📱 ◀ ▶ pour bouger, ⬆️ Saut x2, ⚔️ Attaque, ⏳ TEMPS</p>
<button class="btn" onclick="start()">▶ JOUER EN 4D</button>
<p style="font-size:12px;margin-top:10px">Mbote ! Betu, tokende !</p>
</div>
<div id="hud"><div>🪙 <span id="coins">0</span> ❤️ <span id="lives">3</span></div><div id="timeLabel">🌞 JOUR - 4D</div><div>⭐ <span id="score">0</span></div></div>
<div id="dialog"><b id="dlgName"></b> <span id="dlgText"></span><br><button class="btn" style="padding:8px 18px;font-size:14px;margin-top:8px" onclick="nextDlg()">SUIVANT ▶</button></div>
<div id="controls"><div style="display:flex;gap:10px"><div class="cbtn" id="left">◀</div><div class="cbtn" id="right">▶</div></div><div style="display:flex;gap:10px"><div class="cbtn" id="timeBtn">⏳</div><div class="cbtn" id="atk">⚔️</div><div class="cbtn" id="jump">⬆️</div></div></div>
<script>
let scene,camera,renderer,player,playerGroup,tiko;
let coinsArr=[],enemies=[],platforms=[],hiddenPlatforms=[],boss;
let keys={},coins=0,score=0,lives=3,vy=0,jumps=0,attack=0,playing=false,paused=false;
let isNight=false,dialogStep=0,coinsTaken=0;
let dialogs=[
["MAMA SONIA","Aymard, bienvenue en 4D ! Ici tu contrôles l'ESPACE et le TEMPS."],
["MAMA SONIA","Appuie sur ⏳ TEMPS pour passer de JOUR à NUIT. Des plateformes secrètes vont apparaître !"],
["TIKO","Tiko est là ! En 4D, on est trop stylé !"],
["KAZI","Moi KAZI, je te protège. Va battre MOKÉ !"]
];
function start(){document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('controls').style.display='flex';init();showDlg();animate();}
function showDlg(){paused=true;document.getElementById('dialog').style.display='block';document.getElementById('dlgName').textContent=dialogs[dialogStep][0]+" :";document.getElementById('dlgText').textContent=dialogs[dialogStep][1];}
function nextDlg(){dialogStep++;if(dialogStep>=dialogs.length){document.getElementById('dialog').style.display='none';paused=false;}else showDlg();}
function makeBox(w,h,d,color,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color}));m.position.set(x,y,z);scene.add(m);return m;}
function init(){
scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,40,120);
camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,500);
renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.8));let sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(20,30,20);scene.add(sun);
// Sol 3D
for(let i=0;i<30;i++){let p=makeBox(8,1,8,0x4CAF50,i*8-20,-0.5,0);platforms.push(p);}
for(let i=0;i<8;i++){let t=makeBox(1,8,1,0x8D6E63,-10+i*24,4,-6);let l=new THREE.Mesh(new THREE.SphereGeometry(4,12,12),new THREE.MeshLambertMaterial({color:0x2E7D32}));l.position.set(-10+i*24,10,-6);scene.add(l);}
// Plateformes normales
[[15,4,0],[30,6,0],[50,4,0],[70,7,0],[90,5,0]].forEach(a=>{let p=makeBox(6,0.6,4,0x8D6E63,a[0],a[1],0);platforms.push(p);});
// Plateformes CACHÉES 4D - visibles que la NUIT
[[22,8,0],[40,9,0],[60,10,0],[80,9,0]].forEach(a=>{let p=makeBox(5,0.6,4,0x00E5FF,a[0],a[1],0);p.visible=false;hiddenPlatforms.push(p);platforms.push(p);});
// AYMARD 3D
playerGroup=new THREE.Group();
let body=new THREE.Mesh(new THREE.BoxGeometry(1,1.4,0.6),new THREE.MeshLambertMaterial({color:0xFF8C42}));body.position.y=0.7;playerGroup.add(body);
let head=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.6),new THREE.MeshLambertMaterial({color:0x8D5524}));head.position.y=1.8;playerGroup.add(head);
let hair=new THREE.Mesh(new THREE.BoxGeometry(0.95,0.3,0.65),new THREE.MeshLambertMaterial({color:0x111111}));hair.position.y=2.25;playerGroup.add(hair);
let med=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,10),new THREE.MeshLambertMaterial({color:0xFFD700}));med.position.set(0,1.1,0.35);playerGroup.add(med);
playerGroup.position.set(0,2,0);scene.add(playerGroup);
player=playerGroup;
// TIKO 3D
tiko=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,12),new THREE.MeshLambertMaterial({color:0xFFA726}));scene.add(tiko);
// Pièces 3D qui tournent
for(let i=0;i<18;i++){let c=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.15,16),new THREE.MeshLambertMaterial({color:0xFFD700}));c.rotation.z=Math.PI/2;c.position.set(5+i*9,4+(i%3)*2,0);scene.add(c);coinsArr.push(c);}
// Ennemis 3D
for(let i=0;i<5;i++){let e=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),new THREE.MeshLambertMaterial({color:0x5D4037}));e.position.set(20+i*22,0.6,0);e.userData={dir:1,alive:true};scene.add(e);enemies.push(e);}
// Boss MOKÉ 3D géant
boss=new THREE.Mesh(new THREE.BoxGeometry(4,5,3),new THREE.MeshLambertMaterial({color:0x2E7D32}));boss.position.set(170,2.5,0);boss.userData={hp:8,alive:true,dir:1};scene.add(boss);
let temple=makeBox(6,7,6,0x6A4C93,185,3.5,0);
let goal=makeBox(2,4,2,0xFFD700,185,2,2);
}
function toggleTime(){isNight=!isNight;scene.background=new THREE.Color(isNight?0x0A0A2A:0x87CEEB);scene.fog.color=new THREE.Color(isNight?0x0A0A2A:0x87CEEB);hiddenPlatforms.forEach(p=>p.visible=isNight);document.getElementById('timeLabel').textContent=isNight?"🌙 NUIT 4D - Plateformes visibles !":"🌞 JOUR - 4D";}
function bind(id,code,action){let el=document.getElementById(id);let s=e=>{e.preventDefault();keys[code]=true;if(action)action()},en=e=>{e.preventDefault();keys[code]=false};el.addEventListener('touchstart',s);el.addEventListener('touchend',en);el.addEventListener('mousedown',s);el.addEventListener('mouseup',en);}
bind('left','ArrowLeft');bind('right','ArrowRight');bind('jump','Space',()=>{if(jumps<2){vy=0.22;jumps++;}});bind('atk','KeyX',()=>attack=15);bind('timeBtn','KeyT',toggleTime);
addEventListener('keydown',e=>{if(e.code==='Space'){if(!keys['Space'])vy=0.22;keys[e.code]=true}else if(e.code==='KeyT')toggleTime();else keys[e.code]=true;if(e.code==='KeyX')attack=15;});
addEventListener('keyup',e=>keys[e.code]=false);
function animate(){
requestAnimationFrame(animate);if(!playing&&document.getElementById('menu').style.display!=='none')return;
if(paused){renderer.render(scene,camera);return}playing=true;
let speed=0.18;if(keys['ArrowLeft'])player.position.x-=speed;if(keys['ArrowRight'])player.position.x+=speed;
vy-=0.012;player.position.y+=vy;
// Sol
let groundY=0.8;
for(let p of platforms){if(p.visible!==false&&Math.abs(player.position.x-p.position.x)<4&&Math.abs(player.position.z-p.position.z)<3&&player.position.y> p.position.y&&player.position.y< p.position.y+1.2&&vy<=0){player.position.y=p.position.y+1.2;vy=0;jumps=0;}}
if(player.position.y<0.8){player.position.y=0.8;vy=0;jumps=0}
if(player.position.y<-5){lives--;document.getElementById('lives').textContent=lives;player.position.set(0,2,0);if(lives<=0){alert('MAMA SONIA : Réessaie !');location.reload();}}
if(attack>0)attack--;
tiko.position.set(player.position.x-1.5,player.position.y+0.5,1);tiko.rotation.y+=0.05;
coinsArr.forEach(c=>{c.rotation.x+=0.05;if(c.visible&&Math.abs(player.position.x-c.position.x)<1.5&&Math.abs(player.position.y-c.position.y)<2){c.visible=false;coins++;score+=100;document.getElementById('coins').textContent=coins;document.getElementById('score').textContent=score;}});
enemies.forEach(e=>{if(!e.userData.alive)return;e.position.x+=0.05*e.userData.dir;if(e.position.x>200)e.userData.dir=-1;if(e.position.x<10)e.userData.dir=1;if(attack>0&&Math.abs(player.position.x-e.position.x)<2){e.userData.alive=false;e.visible=false;score+=200;document.getElementById('score').textContent=score;}else if(Math.abs(player.position.x-e.position.x)<1&&Math.abs(player.position.y-e.position.y)<1.5){lives--;document.getElementById('lives').textContent=lives;player.position.x-=2;if(lives<=0)location.reload();}});
if(boss.userData.alive){boss.position.x+=0.03*boss.userData.dir;if(boss.position.x>180)boss.userData.dir=-1;if(boss.position.x<160)boss.userData.dir=1;if(attack>0&&Math.abs(player.position.x-boss.position.x)<3){boss.userData.hp--;attack=0;if(boss.userData.hp<=0){boss.userData.alive=false;boss.visible=false;score+=1000;document.getElementById('score').textContent=score;}}}
if(Math.abs(player.position.x-185)<3){document.getElementById('menu').style.display='flex';document.getElementById('menu').innerHTML=`<h1 style="color:#FFD700">🎉 VICTOIRE 4D !</h1><p style="margin:14px;line-height:1.7">Tu as battu MOKÉ !<br>Tu as la PIERRE DE LA FORÊT 🌿<br>🪙 ${coins} | ⭐ ${score}<br><br>MAMA SONIA : "Bien joué, mwana na ngai !"<br><br>MONDE 2 : ROYAUME DES EAUX - Bientôt !</p><button class="btn" onclick="location.reload()">🔁 REJOUER</button>`;playing=false;}
camera.position.set(player.position.x-6,player.position.y+5,12);camera.lookAt(player.position.x,player.position.y+1,0);
renderer.render(scene,camera);
}
</script>
</body>
</html>
